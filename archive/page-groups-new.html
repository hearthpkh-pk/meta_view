<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Views - จัดการกรุ๊ปเพจ</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta Theme CSS -->
    <link rel="stylesheet" href="./src/styles/meta-theme.css">
</head>
<body class="font-noto-thai bg-gray-50">
    
    <!-- Navigation Bar -->
    <div id="navigation"></div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-layer-group text-blue-600 mr-3"></i>
                        จัดการกรุ๊ปเพจ
                    </h1>
                    <p class="text-gray-600">จัดกรุ๊ปเพจที่เปิดใช้งานอยู่แยกตามหมวดหมู่</p>
                </div>
                <div class="flex gap-3">
                    <button id="saveLayoutBtn" class="btn-success">
                        <i class="fas fa-save mr-2"></i>บันทึกรูปแบบ
                    </button>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="meta-card mb-6">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">สร้างหมวดหมู่ใหม่</label>
                    <div class="flex gap-2">
                        <input type="text" id="newCategoryName" class="meta-input" placeholder="ชื่อหมวดหมู่...">
                        <button id="addCategoryBtn" class="btn-primary">
                            <i class="fas fa-plus mr-2"></i>เพิ่ม
                        </button>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="refreshBtn" class="btn-secondary">
                        <i class="fas fa-sync mr-2"></i>รีเฟรช
                    </button>
                </div>
            </div>
        </div>

        <!-- Kanban Board -->
        <div id="kanbanBoard" class="kanban-board">
            <!-- Categories will be dynamically added here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="text-6xl mb-4">📭</div>
            <h3 class="text-xl font-semibold text-gray-700 mb-2">ยังไม่มีเพจที่เปิดใช้งาน</h3>
            <p class="text-gray-500 mb-6">กรุณาไปที่หน้าจัดการเพจเพื่อเปิดสถานะการดึงข้อมูลก่อน</p>
            <a href="index.html" class="btn-primary inline-block">
                <i class="fas fa-cog mr-2"></i>ไปหน้าจัดการเพจ
            </a>
        </div>
    </div>

    <!-- Page Card Template (Hidden) -->
    <template id="pageCardTemplate">
        <div class="kanban-card">
            <div class="flex justify-between items-start mb-2">
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-800 text-sm mb-1 page-name"></h4>
                    <p class="text-xs text-gray-500 font-inter-mono page-id"></p>
                </div>
                <button class="text-gray-400 hover:text-red-500 text-xs remove-page">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="flex items-center text-xs text-gray-600">
                <i class="fas fa-link mr-1"></i>
                <span class="token-name"></span>
            </div>
        </div>
    </template>

    <!-- Category Template (Hidden) -->
    <template id="categoryTemplate">
        <div class="kanban-column">
            <div class="kanban-column-header">
                <h3 class="kanban-column-title category-name"></h3>
                <div class="flex gap-1">
                    <button class="text-gray-400 hover:text-blue-500 text-xs edit-category">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="text-gray-400 hover:text-red-500 text-xs delete-category">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            <div class="kanban-cards-container">
                <!-- Page cards will be added here -->
            </div>
            <div class="text-center mt-2 text-xs text-gray-500">
                <span class="page-count">0</span> เพจ
            </div>
        </div>
    </template>

    <script type="module" src="./src/js/page-groups-new.js"></script>
</body>
</html>
