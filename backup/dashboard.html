<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Views - Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-3xl font-bold text-indigo-600">📈 Analytics Dashboard</h1>
                <p class="text-gray-500 mt-1 text-sm">ดูสถิติยอดวิวและจำนวนโพสต์รายวันจากทุกเพจ</p>
            </div>
            <a href="index.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition">
                ⚙️ ไปหน้าจัดการเพจ
            </a>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-wrap items-end gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ตั้งแต่วันที่</label>
                <input type="date" id="startDate" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 w-40 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ถึงวันที่</label>
                <input type="date" id="endDate" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 w-40 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button onclick="loadDashboardData()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition shadow-sm">
                🔍 ดึงข้อมูล
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-xl p-6 shadow-md text-white">
                <p class="text-emerald-50 text-sm font-medium mb-1">ยอดดูสื่อทั้งหมด (Total Views)</p>
                <h2 id="totalViews" class="text-4xl font-black">0</h2>
            </div>
            <div class="bg-gradient-to-br from-blue-400 to-blue-600 rounded-xl p-6 shadow-md text-white">
                <p class="text-blue-50 text-sm font-medium mb-1">จำนวนโพสต์รวม (Total Posts)</p>
                <h2 id="totalPosts" class="text-4xl font-black">0</h2>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h3 class="font-bold text-gray-800">📋 สถิติแยกตามเพจและวันที่</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white border-b border-gray-200 text-sm">
                            <th class="px-6 py-4 font-semibold text-gray-600">วันที่ (Date)</th>
                            <th class="px-6 py-4 font-semibold text-gray-600">ชื่อเพจ (Page Name)</th>
                            <th class="px-6 py-4 font-semibold text-gray-600 text-right">ยอดวิว (Views)</th>
                            <th class="px-6 py-4 font-semibold text-gray-600 text-right">จำนวนโพสต์ (Posts)</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <tr><td colspan="4" class="text-center py-8 text-gray-500">กรุณากดปุ่ม "ดึงข้อมูล" เพื่อดูสถิติ</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ ตั้งค่า Database (ให้ Dev ใส่ค่าเดียวกับหน้า index.html)
        // ==========================================
        const SUPABASE_URL = 'https://ifrcrkjajjfzarnasjsk.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmcmNya2phampmemFybmFzanNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MTkzMjgsImV4cCI6MjA4ODA5NTMyOH0.983WTrF9lmKyGra_ZeW8KuBYbxUdl0qCA0qpDeKCXcU'; // หน้า Frontend ใช้แค่ ANON KEY ก็พอครับ (ความปลอดภัย)

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ตั้งค่าวันที่เริ่มต้น (Default เป็น 7 วันย้อนหลัง)
        window.onload = () => {
            const today = new Date();
            const lastWeek = new Date();
            lastWeek.setDate(today.getDate() - 7);
            
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
            document.getElementById('startDate').value = lastWeek.toISOString().split('T')[0];
        };

        // ฟังก์ชันดึงข้อมูลจาก Database
        async function loadDashboardData() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const tbody = document.getElementById('dataTableBody');

            if (!startDate || !endDate) {
                alert("กรุณาเลือกวันที่ให้ครบถ้วน");
                return;
            }

            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500"><div class="animate-pulse">กำลังโหลดข้อมูล...</div></td></tr>';

            // Query ข้อมูลจากตาราง daily_stats และ JOIN เอาชื่อเพจจากตาราง pages
            const { data, error } = await db
                .from('daily_stats')
                .select(`
                    date,
                    page_media_views,
                    posts_count,
                    pages ( name )
                `)
                .gte('date', startDate)
                .lte('date', endDate)
                .order('date', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-500">เกิดข้อผิดพลาด: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                document.getElementById('totalViews').innerText = "0";
                document.getElementById('totalPosts').innerText = "0";
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">ไม่พบข้อมูลในช่วงวันที่เลือก</td></tr>';
                return;
            }

            // คำนวณผลรวม
            let sumViews = 0;
            let sumPosts = 0;
            let tableHTML = '';

            data.forEach(row => {
                sumViews += (row.page_media_views || 0);
                sumPosts += (row.posts_count || 0);
                
                // ดึงชื่อเพจจากการทำ Foreign Key Join
                const pageName = row.pages ? row.pages.name : 'ไม่ทราบชื่อเพจ';

                tableHTML += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="px-6 py-4 text-sm font-mono text-gray-600">${row.date}</td>
                        <td class="px-6 py-4 font-medium text-gray-800">${pageName}</td>
                        <td class="px-6 py-4 text-right font-bold text-emerald-600">${(row.page_media_views || 0).toLocaleString()}</td>
                        <td class="px-6 py-4 text-right text-gray-600">${row.posts_count || 0}</td>
                    </tr>
                `;
            });

            // อัปเดตหน้าจอ
            document.getElementById('totalViews').innerText = sumViews.toLocaleString();
            document.getElementById('totalPosts').innerText = sumPosts.toLocaleString();
            tbody.innerHTML = tableHTML;
        }
    </script>
</body>
</html>
