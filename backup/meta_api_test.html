<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบดึงข้อมูล Facebook Page ด้วย Token</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8 min-h-screen flex justify-center">

    <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg overflow-hidden h-fit">

        <!-- Header Section -->
        <div class="bg-blue-600 p-6 text-white">
            <h1 class="text-2xl font-bold flex items-center">
                <svg class="w-8 h-8 mr-3" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                </svg>
                ทดสอบดึงข้อมูล Facebook Page ด้วย Token
            </h1>
            <p class="mt-2 text-blue-100 text-sm">ประยุกต์ใช้เทคนิค User Token -> ดึง Page Token แบบอัตโนมัติ</p>
        </div>

        <!-- Main Content -->
        <div class="p-6 md:p-8">

            <!-- Token Input -->
            <div class="mb-4">
                <label for="accessToken" class="block text-sm font-bold text-gray-700 mb-2">1. วาง User Token
                    (โทเค็นผู้ใช้) ของคุณที่นี่</label>
                <textarea id="accessToken" rows="4"
                    class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm font-mono bg-gray-50"
                    placeholder="EAAPXFnUc1c..."></textarea>
                <p class="text-xs text-gray-500 mt-2">*ใช้ User Token ที่มีสิทธิ์ pages_show_list,
                    pages_read_engagement, read_insights</p>

                <button id="loadPagesBtn"
                    class="mt-4 bg-gray-800 hover:bg-black text-white font-bold py-2.5 px-6 rounded-md transition duration-200">
                    โหลดรายชื่อเพจจาก Token นี้
                </button>
            </div>

            <!-- Page Selector (Hidden until token is loaded) -->
            <div id="pageSelectionBox" class="mb-6 hidden bg-gray-50 p-4 border border-gray-200 rounded-md">
                <label for="pageSelector"
                    class="block text-sm font-bold text-gray-700 mb-2">เลือกเพจที่ต้องการดึงข้อมูล</label>
                <select id="pageSelector"
                    class="w-full md:w-1/2 px-4 py-2 border border-gray-300 rounded-md text-sm"></select>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 mt-6 mb-6">
                <button id="fetchBasicBtn"
                    class="bg-blue-400 hover:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-md transition duration-200 shadow-sm disabled:opacity-50"
                    disabled>
                    ดึงข้อมูลพื้นฐานเพจ
                </button>
                <button id="fetchPostsBtn"
                    class="bg-green-400 hover:bg-green-500 text-white font-bold py-2.5 px-6 rounded-md transition duration-200 shadow-sm disabled:opacity-50"
                    disabled>
                    ดึงข้อมูลโพสต์ล่าสุด
                </button>
            </div>

            <!-- Alert Box -->
            <div id="statusMessage"
                class="bg-red-100 text-red-700 border border-red-200 p-3 rounded-md text-sm font-medium mb-8 hidden">
                เกิดข้อผิดพลาด:กรุณาวาง Token ก่อนครับ
            </div>

            <hr class="border-gray-200 mb-8">

            <!-- Date Selection Section -->
            <div class="mb-4">
                <h2 class="text-lg font-bold text-gray-800 mb-4">ดึงยอดผู้เข้าชม (Views) และการเข้าถึงตามช่วงวันที่</h2>

                <div class="flex flex-wrap items-end gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">ตั้งแต่วันที่</label>
                        <input type="date" id="startDate"
                            class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 w-40">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">ถึงวันที่</label>
                        <input type="date" id="endDate"
                            class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 w-40">
                    </div>
                    <button id="fetchInsightsBtn"
                        class="bg-purple-400 hover:bg-purple-500 text-white font-bold py-2.5 px-6 rounded-md transition duration-200 shadow-sm disabled:opacity-50"
                        disabled>
                        ดึงข้อมูลวันที่เลือก
                    </button>
                </div>
            </div>

            <!-- Results Display Area (Hidden initially) -->
            <div id="resultsArea" class="mt-8 hidden">
                <h3 class="font-bold text-gray-800 border-b pb-2 mb-4" id="resultTitle">ผลลัพธ์</h3>
                <div id="resultContent"
                    class="bg-gray-50 p-4 border border-gray-200 rounded-md text-sm overflow-x-auto">
                    <!-- Data will be populated here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_VERSION = 'v25.0';
        let activePageToken = '';
        let activePageId = '';

        // Elements
        const loadPagesBtn = document.getElementById('loadPagesBtn');
        const fetchBasicBtn = document.getElementById('fetchBasicBtn');
        const fetchPostsBtn = document.getElementById('fetchPostsBtn');
        const fetchInsightsBtn = document.getElementById('fetchInsightsBtn');
        const statusMessage = document.getElementById('statusMessage');
        const pageSelectionBox = document.getElementById('pageSelectionBox');
        const pageSelector = document.getElementById('pageSelector');
        const resultsArea = document.getElementById('resultsArea');
        const resultContent = document.getElementById('resultContent');
        const resultTitle = document.getElementById('resultTitle');

        // Set default dates
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            document.getElementById('startDate').value = firstDay.toISOString().split('T')[0];
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
        });

        function showStatus(message, isError = false) {
            statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-200', 'bg-green-100', 'text-green-700', 'border-green-200', 'bg-blue-100', 'text-blue-700', 'border-blue-200');

            if (isError) {
                statusMessage.classList.add('bg-red-100', 'text-red-700', 'border-red-200');
                statusMessage.innerHTML = `<strong>เกิดข้อผิดพลาด:</strong> ${message}`;
            } else if (message.includes('สำเร็จ')) {
                statusMessage.classList.add('bg-green-100', 'text-green-700', 'border-green-200');
                statusMessage.innerHTML = message;
            } else {
                statusMessage.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-200');
                statusMessage.innerHTML = `<div class="loader"></div> ${message}`;
            }
        }

        function toggleButtons(enable) {
            fetchBasicBtn.disabled = !enable;
            fetchPostsBtn.disabled = !enable;
            fetchInsightsBtn.disabled = !enable;
        }

        function displayResult(title, htmlContent) {
            resultTitle.textContent = title;
            resultContent.innerHTML = htmlContent;
            resultsArea.classList.remove('hidden');
        }

        // 1. Load Pages
        loadPagesBtn.addEventListener('click', async () => {
            const token = document.getElementById('accessToken').value.trim();
            if (!token) {
                showStatus('กรุณาวาง Token ก่อนครับ', true);
                return;
            }

            showStatus('กำลังโหลดรายชื่อเพจ...');
            toggleButtons(false);
            pageSelectionBox.classList.add('hidden');
            resultsArea.classList.add('hidden');

            try {
                const res = await fetch(`https://graph.facebook.com/${API_VERSION}/me/accounts?limit=100&access_token=${token}`);
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);
                if (!data.data || data.data.length === 0) throw new Error("ไม่พบเพจใน Token นี้");

                pageSelector.innerHTML = '';
                data.data.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.access_token;
                    opt.dataset.pageId = p.id;
                    opt.textContent = `${p.name} (ID: ${p.id})`;
                    pageSelector.appendChild(opt);
                });

                activePageToken = pageSelector.options[0].value;
                activePageId = pageSelector.options[0].dataset.pageId;

                pageSelectionBox.classList.remove('hidden');
                toggleButtons(true);
                showStatus(`โหลดรายชื่อเพจสำเร็จ พบ ${data.data.length} เพจ`);

            } catch (error) {
                showStatus(error.message, true);
            }
        });

        pageSelector.addEventListener('change', (e) => {
            activePageToken = e.target.value;
            activePageId = e.target.options[e.target.selectedIndex].dataset.pageId;
            resultsArea.classList.add('hidden');
        });

        // 2. Fetch Basic Info
        fetchBasicBtn.addEventListener('click', async () => {
            showStatus('กำลังดึงข้อมูลพื้นฐาน...');
            try {
                const res = await fetch(`https://graph.facebook.com/${API_VERSION}/${activePageId}?fields=id,name,followers_count,fan_count&access_token=${activePageToken}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                const html = `
                    <p><strong>ชื่อเพจ:</strong> ${data.name || '-'}</p>
                    <p><strong>Page ID:</strong> ${data.id || '-'}</p>
                    <p><strong>ผู้ติดตาม (Followers):</strong> ${(data.followers_count || 0).toLocaleString()}</p>
                    <p><strong>ถูกใจ (Likes):</strong> ${(data.fan_count || 0).toLocaleString()}</p>
                `;
                displayResult('ข้อมูลพื้นฐานเพจ', html);
                showStatus('ดึงข้อมูลพื้นฐานสำเร็จ');
            } catch (error) {
                showStatus(error.message, true);
            }
        });

        // 3. Fetch Posts
        fetchPostsBtn.addEventListener('click', async () => {
            showStatus('กำลังดึงข้อมูลโพสต์...');
            try {
                // ขอข้อมูลเพิ่ม: รูปภาพเต็ม, สรุปยอดไลก์, ยอดคอมเมนต์, ยอดแชร์
                const fields = 'id,message,created_time,full_picture,likes.summary(true),comments.summary(true),shares';
                const res = await fetch(`https://graph.facebook.com/${API_VERSION}/${activePageId}/posts?limit=5&fields=${fields}&access_token=${activePageToken}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                let html = '<div class="space-y-6">';
                if (data.data && data.data.length > 0) {
                    data.data.forEach(post => {
                        // จัดฟอร์แมตวันที่แบบไทย
                        const dateObj = new Date(post.created_time);
                        const dateStr = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
                        const timeStr = dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                        const msg = post.message ? post.message.replace(/\n/g, '<br>') : '[ไม่มีข้อความ]';
                        const imgHtml = post.full_picture ? `<img src="${post.full_picture}" class="mt-4 rounded-md max-h-96 object-contain bg-gray-100 w-full">` : '';

                        // ดึงยอดต่างๆ (ถ้าไม่มีให้เป็น 0)
                        const likes = post.likes?.summary?.total_count || 0;
                        const comments = post.comments?.summary?.total_count || 0;
                        const shares = post.shares?.count || 0;

                        html += `
                            <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-xs text-gray-500 font-mono">Post ID: ${post.id}</span>
                                    <span class="text-xs text-gray-500 flex items-center">
                                        <svg class="w-3 h-3 mr-1 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        ${dateStr} เวลา ${timeStr}
                                    </span>
                                </div>
                                <div class="text-sm text-gray-800 mb-2">
                                    ${msg}
                                </div>
                                ${imgHtml}
                                <div class="flex items-center gap-4 mt-4 pt-3 border-t border-gray-100 text-sm text-gray-600">
                                    <span class="flex items-center"><span class="mr-1 text-yellow-500">👍</span> ${likes.toLocaleString()}</span>
                                    <span class="flex items-center"><span class="mr-1 text-blue-400">💬</span> ${comments.toLocaleString()}</span>
                                    <span class="flex items-center"><span class="mr-1 text-gray-400">↗️</span> ${shares.toLocaleString()}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html += '<div class="text-gray-500 p-4 bg-white rounded border">ไม่พบโพสต์ล่าสุด</div>';
                }
                html += '</div>';

                displayResult('โพสต์ล่าสุดด้านบน (สูงสุด 5 โพสต์)', html);
                showStatus('ดึงข้อมูลโพสต์สำเร็จ');
            } catch (error) {
                showStatus(error.message, true);
            }
        });

        // 4. Fetch Insights (Custom Dates)
        fetchInsightsBtn.addEventListener('click', async () => {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            if (!startDate || !endDate) {
                showStatus('กรุณาเลือกวันที่ให้ครบ', true);
                return;
            }

            showStatus('กำลังดึงข้อมูล Insights...');

            const startUnix = Math.floor(new Date(startDate).getTime() / 1000) - 86400;
            const endUnix = Math.floor(new Date(endDate).getTime() / 1000) + 86400;

            try {
                // เปลี่ยนไปดึงยอดวิวรวมจากเมตริกลับ (page_media_view)
                const res = await fetch(`https://graph.facebook.com/${API_VERSION}/${activePageId}/insights/page_media_view/day?since=${startUnix}&until=${endUnix}&access_token=${activePageToken}`);
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);

                let totalImp = 0;
                let details = '';

                if (data.data && data.data.length > 0) {
                    data.data[0].values.forEach(v => {
                        // ปรับเวลาถอยหลัง 12 ชม ให้ตรงวันที่
                        const d = new Date(v.end_time);
                        d.setUTCHours(d.getUTCHours() - 12);
                        const repDate = d.toISOString().split('T')[0];

                        if (repDate >= startDate && repDate <= endDate) {
                            totalImp += (v.value || 0);
                            details += `<tr><td class="border px-4 py-2 text-center font-mono">${repDate}</td><td class="border px-4 py-2 text-right font-medium text-gray-700">${(v.value || 0).toLocaleString()}</td></tr>`;
                        }
                    });
                }

                const html = `
                    <div class="mb-5 bg-white p-4 rounded-lg border border-emerald-200">
                        <p class="text-gray-600 text-sm mb-1">ยอดดู (Views) รวมในช่วงที่เลือก <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded ml-1 font-mono">page_media_view</span></p>
                        <p class="text-4xl font-black text-emerald-600 mt-1">${totalImp.toLocaleString()}</p>
                    </div>
                    <div class="overflow-hidden rounded-lg border border-gray-200">
                        <table class="w-full text-left border-collapse bg-white">
                            <thead>
                                <tr class="bg-gray-100 text-gray-700">
                                    <th class="border-b px-4 py-3 text-center">วันที่</th>
                                    <th class="border-b px-4 py-3 text-right">ยอดดู (Views)</th>
                                </tr>
                            </thead>
                            <tbody>${details}</tbody>
                        </table>
                    </div>
                `;

                displayResult(`ข้อมูล Insights (${startDate} ถึง ${endDate})`, html);
                showStatus('ดึงข้อมูล Insights สำเร็จ');

            } catch (error) {
                showStatus(error.message, true);
            }
        });

    </script>
</body>

</html>
