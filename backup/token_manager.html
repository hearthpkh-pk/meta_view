<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Views - จัดการ Token</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-purple-600">🔑 ระบบจัดการกุญแจ (API Tokens)</h1>
                <p class="text-gray-500 mt-2">เพิ่มและจัดการ Facebook User Token สำหรับดึงข้อมูล</p>
            </div>
            <a href="index.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded shadow transition">
                🔙 กลับหน้าจัดการเพจ
            </a>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8 border border-purple-100">
            <h2 class="text-lg font-bold mb-4 text-gray-700">➕ เพิ่ม Token ใหม่</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อเรียก (เช่น บัญชีแอดมิน A)</label>
                    <input type="text" id="tokenName" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-purple-500 focus:border-purple-500" placeholder="ตั้งชื่อให้จำง่าย...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Access Token (User Token)</label>
                    <textarea id="accessToken" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-purple-500 focus:border-purple-500 font-mono text-sm" placeholder="EAAPXFnUc1c..."></textarea>
                </div>
                <button onclick="saveToken()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-md shadow transition">
                    💾 บันทึก Token
                </button>
            </div>
            <div id="statusMsg" class="mt-4 text-sm hidden"></div>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="px-6 py-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-bold text-gray-700">📋 รายการ Token ในระบบ</h3>
                <button onclick="loadTokens()" class="text-sm text-purple-600 hover:text-purple-800 font-medium">🔄 รีเฟรช</button>
            </div>
            <table class="min-w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 border-b text-sm">
                        <th class="px-6 py-3 font-semibold text-gray-600">ชื่อเรียก</th>
                        <th class="px-6 py-3 font-semibold text-gray-600">สถานะ</th>
                        <th class="px-6 py-3 font-semibold text-gray-600">Token (บางส่วน)</th>
                        <th class="px-6 py-3 font-semibold text-gray-600 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="tokenTableBody">
                    <tr><td colspan="4" class="text-center py-4 text-gray-500">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ ตั้งค่า Database (ใส่ URL และ ANON KEY)
        // ==========================================
        const SUPABASE_URL = 'https://ifrcrkjajjfzarnasjsk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmcmNya2phampmemFybmFzanNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MTkzMjgsImV4cCI6MjA4ODA5NTMyOH0.983WTrF9lmKyGra_ZeW8KuBYbxUdl0qCA0qpDeKCXcU'; // ใช้ Anon Key 

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // โหลดรายการ Token มาแสดง
        async function loadTokens() {
            const tbody = document.getElementById('tokenTableBody');
            const { data, error } = await db.from('tokens').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-500">Error: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-500">ยังไม่มี Token ในระบบ</td></tr>';
                return;
            }

            let html = '';
            data.forEach(token => {
                // ตัดแสดง Token แค่บางส่วนเพื่อความปลอดภัย
                const shortToken = token.access_token.substring(0, 15) + '...';
                const statusColor = token.status === 'active' ? 'text-green-600 bg-green-100' : 'text-red-600 bg-red-100';

                html += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-6 py-4 font-medium text-gray-800">${token.name}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded-full text-xs font-bold ${statusColor}">${token.status}</span>
                        </td>
                        <td class="px-6 py-4 font-mono text-sm text-gray-500">${shortToken}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="deleteToken('${token.id}')" class="text-red-500 hover:text-red-700 text-sm font-medium">🗑️ ลบ</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // บันทึก Token ใหม่ลงฐานข้อมูล
        async function saveToken() {
            const name = document.getElementById('tokenName').value.trim();
            const tokenVal = document.getElementById('accessToken').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!name || !tokenVal) {
                showStatus('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
                return;
            }

            showStatus('กำลังบันทึก...', 'loading');

            const { data, error } = await db.from('tokens').insert([
                { name: name, access_token: tokenVal, status: 'active' }
            ]);

            if (error) {
                showStatus(`เกิดข้อผิดพลาด: ${error.message}`, 'error');
            } else {
                showStatus('✅ บันทึก Token สำเร็จ!', 'success');
                document.getElementById('tokenName').value = '';
                document.getElementById('accessToken').value = '';
                loadTokens(); // รีเฟรชตาราง
            }
        }

        // ลบ Token
        async function deleteToken(id) {
            if(!confirm('คุณแน่ใจหรือไม่ว่าต้องการลบ Token นี้? (อาจทำให้เพจที่ผูกอยู่ดึงข้อมูลไม่ได้)')) return;

            const { error } = await db.from('tokens').delete().eq('id', id);
            if (error) {
                alert('ลบไม่สำเร็จ: ' + error.message);
            } else {
                loadTokens();
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.classList.remove('hidden', 'text-red-600', 'text-green-600', 'text-blue-600');
            if(type === 'error') el.classList.add('text-red-600');
            else if(type === 'success') el.classList.add('text-green-600');
            else el.classList.add('text-blue-600');
            el.innerText = msg;
        }

        // โหลดข้อมูลตอนเปิดหน้า
        loadTokens();
    </script>
</body>
</html>
