<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Views - จัดการกรุ๊ปเพจ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-3xl font-bold text-orange-600">📋 จัดการกรุ๊ปเพจ (Kanban Board)</h1>
                <p class="text-gray-500 mt-1 text-sm">จัดกรุ๊ปเพจที่เปิดใช้งานอยู่แยกตามหมวดหมู่</p>
            </div>
            <div class="flex gap-3">
                <a href="index.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition">
                    ⚙️ ไปหน้าจัดการเพจ
                </a>
                <a href="dashboard.html" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                    📈 ดูหน้าสถิติ
                </a>
            </div>
        </div>

        <!-- Controls -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">สร้างหมวดหมู่ใหม่</label>
                    <div class="flex gap-2">
                        <input type="text" id="newCategoryName" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-orange-500 focus:border-orange-500" placeholder="ชื่อหมวดหมู่...">
                        <button id="addCategoryBtn" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-lg transition">
                            <i class="fas fa-plus mr-2"></i>เพิ่ม
                        </button>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="refreshBtn" class="text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium transition border border-blue-200">
                        <i class="fas fa-sync mr-2"></i>รีเฟรช
                    </button>
                    <button id="saveLayoutBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition">
                        <i class="fas fa-save mr-2"></i>บันทึกรูปแบบ
                    </button>
                </div>
            </div>
        </div>

        <!-- Kanban Board -->
        <div id="kanbanBoard" class="flex gap-6 overflow-x-auto pb-6">
            <!-- Categories will be dynamically added here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="text-6xl mb-4">📭</div>
            <h3 class="text-xl font-semibold text-gray-700 mb-2">ยังไม่มีเพจที่เปิดใช้งาน</h3>
            <p class="text-gray-500 mb-6">กรุณาไปที่หน้าจัดการเพจเพื่อเปิดสถานะการดึงข้อมูลก่อน</p>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition inline-block">
                <i class="fas fa-cog mr-2"></i>ไปหน้าจัดการเพจ
            </a>
        </div>
    </div>

    <!-- Page Card Template (Hidden) -->
    <template id="pageCardTemplate">
        <div class="page-card bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-3 cursor-move hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-2">
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-800 text-sm mb-1 page-name"></h4>
                    <p class="text-xs text-gray-500 font-mono page-id"></p>
                </div>
                <button class="text-gray-400 hover:text-red-500 text-xs remove-page">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="flex items-center text-xs text-gray-600">
                <i class="fas fa-link mr-1"></i>
                <span class="token-name"></span>
            </div>
        </div>
    </template>

    <!-- Category Template (Hidden) -->
    <template id="categoryTemplate">
        <div class="category-column flex-shrink-0 w-80 bg-gray-100 rounded-lg p-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800 category-name"></h3>
                <div class="flex gap-1">
                    <button class="text-gray-400 hover:text-blue-500 text-xs edit-category">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="text-gray-400 hover:text-red-500 text-xs delete-category">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            <div class="pages-container min-h-[200px] bg-white rounded-lg p-3 border-2 border-dashed border-gray-300">
                <!-- Page cards will be added here -->
            </div>
            <div class="text-center mt-2 text-xs text-gray-500">
                <span class="page-count">0</span> เพจ
            </div>
        </div>
    </template>

    <script type="module" src="./src/js/page-groups-new.js"></script>
</body>
</html>
